<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc">
<title id="title">Illustrative coordinate mission and obstacle detour</title>
<desc id="desc">Top-down local map. Start North zero East zero, goal North forty East zero. A central obstacle blocks the direct line. An illustrative route passes west via North ten East minus nine and North thirty East minus nine. This is not observed ArduPilot output.</desc>
<rect width="1000" height="930" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#17202a">
<text x="40" y="45" font-size="25" font-weight="bold">One destination; an obstacle changes the route</text>
<text x="40" y="73" font-size="16">Illustrative geometry only · fixed Down = −8 m relative to the EKF origin</text>
<path d="M150 740H570" stroke="#dce3e9"/>
<text x="125" y="745" font-size="14" text-anchor="end">0</text>
<path d="M150 600H570" stroke="#dce3e9"/>
<text x="125" y="605" font-size="14" text-anchor="end">10</text>
<path d="M150 460H570" stroke="#dce3e9"/>
<text x="125" y="465" font-size="14" text-anchor="end">20</text>
<path d="M150 320H570" stroke="#dce3e9"/>
<text x="125" y="325" font-size="14" text-anchor="end">30</text>
<path d="M150 180H570" stroke="#dce3e9"/>
<text x="125" y="185" font-size="14" text-anchor="end">40</text>
<path d="M220 110V810" stroke="#dce3e9"/>
<text x="220" y="837" font-size="14" text-anchor="middle">-10</text>
<path d="M290 110V810" stroke="#dce3e9"/>
<text x="290" y="837" font-size="14" text-anchor="middle">-5</text>
<path d="M360 110V810" stroke="#dce3e9"/>
<text x="360" y="837" font-size="14" text-anchor="middle">0</text>
<path d="M430 110V810" stroke="#dce3e9"/>
<text x="430" y="837" font-size="14" text-anchor="middle">5</text>
<path d="M500 110V810" stroke="#dce3e9"/>
<text x="500" y="837" font-size="14" text-anchor="middle">10</text>
<rect x="164" y="152" width="392" height="616" rx="2" fill="none" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="360" y="869" font-size="17" text-anchor="middle">East (m) →</text>
<text x="54" y="450" transform="rotate(-90 54 450)" font-size="17">North (m) →</text>
<rect x="276" y="362" width="168" height="196" fill="#fff2da" stroke="#b36b00" stroke-dasharray="6 4"/>
<rect x="304" y="390" width="112" height="140" fill="#526171"/>
<text x="360" y="455" font-size="16" text-anchor="middle" fill="#fff">Obstacle</text>
<path d="M360 740L360 180" stroke="#a82626" stroke-width="3" stroke-dasharray="8 5" fill="none"/>
<polyline points="360,740 234,600 234,320 360,180" fill="none" stroke="#006b78" stroke-width="5" stroke-linejoin="round"/>
<circle cx="360" cy="740" r="7" fill="#006b78" stroke="#fff" stroke-width="2"/>
<text x="373" y="728" text-anchor="start" font-size="16">Start (0, 0)</text>
<circle cx="234" cy="600" r="7" fill="#006b78" stroke="#fff" stroke-width="2"/>
<text x="247" y="588" text-anchor="start" font-size="16">P1 (10, −9)</text>
<circle cx="234" cy="320" r="7" fill="#006b78" stroke="#fff" stroke-width="2"/>
<text x="221" y="308" text-anchor="end" font-size="16">P2 (30, −9)</text>
<circle cx="360" cy="180" r="7" fill="#006b78" stroke="#fff" stroke-width="2"/>
<text x="373" y="168" text-anchor="start" font-size="16">Goal (40, 0)</text>
<text x="600" y="190" font-size="16">Mission supplies the final goal</text>
<text x="600" y="220" font-size="16">[North 40, East 0, Down −8] m</text>
<text x="600" y="300" font-size="16">Red: direct route is blocked</text>
<text x="600" y="350" font-size="16">Amber: expanded exclusion region</text>
<text x="600" y="400" font-size="16">Teal: one possible detour</text>
<text x="600" y="460" font-size="16">P1 and P2 are route references,</text>
<text x="600" y="485" font-size="16">not separate user instructions.</text>
<text x="600" y="560" font-size="16">Navigation adds timing and limits.</text>
<text x="600" y="585" font-size="16">Controllers calculate motor outputs.</text>
<text x="600" y="650" font-size="16">New observations can change</text>
<text x="600" y="675" font-size="16">or invalidate the route.</text>
<text x="40" y="909" font-size="14">Coordinates shown as (North, East). No planner run, SITL flight, clearance qualification or performance result is claimed.</text>
</g></svg>